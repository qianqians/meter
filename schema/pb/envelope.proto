syntax = "proto3";

// 帧载荷的最外层结构（**已定**）：每一帧的 payload 就是一个 `Envelope`，**只有这一层**。
//
//   Envelope{ msg_type, method, callback_id, status, body = <具体消息> }
//   body ∈ NotifyConnID / LoginResult / CreateEntity / CallEntity / CallGlobal …
//
// `CallEntity.content` / `CallGlobal.content` 里放的是**逻辑层决定的那条 protobuf 消息的序列化字节**：
// 框架不解释它（gate 连类型都不知道），类型由**本消息的 `method`** 决定。
// 也就是说 method / callback_id / status 只在最外层出现一次，不存在嵌套的信封。
//
// **没有内部封套**：跨进程的路由信息（源/目的节点、目的实体、trace）由各条内部消息
// 自己的字段表达（`CallEntity.entity_id`、`GateForwardHubCallClient.conn_id`、
// `CrossCallRequest.dst_entity`…），不再额外包一层 `InternalEnvelope`。
//
package fw;

option go_package = "meter/schema/pb;pb";

// msg_type 的取值。
//
// 这里用 proto enum（而不是 uint32 + 手写常量）：客户端是 Cocos、服务端是 Bun，
// 两边都能直接执行/编译 TS `enum`，所以 `erasableSyntaxOnly` 这个约束已经被放弃
// （决策与代价见 docs/protocol-map.md §4.6.1）。enum 换来的是：类型检查、穷尽 switch、
// Go 侧自动生成的常量，以及 schema 自身即文档。
//
// ⚠️ proto3 的 enum 是**开放**的：不认识的值会被原样保留为数字（不会报错）。
// 所以接收端必须有 default 分支——未知 msg_type **丢弃 + 计数**，绝不猜。
enum MsgType {
  MSG_NONE = 0;      // 未设置 / 非法：收到即丢弃
  MSG_REQUEST = 1;   // 请求：必须有 callback_id > 0
  MSG_RESPONSE = 2;  // 响应：callback_id 原样回填
  MSG_NOTIFY = 3;    // 单向通知：callback_id 必须为 0
}

message Envelope {
  // 消息类型。用 enum 而不是 uint32（理由见文件头）。
  MsgType msg_type = 1;

  // 方法名，形如 "fw.ClientGate/Auth"（= 完整服务名/方法名，gRPC 风格）。
  //
  // 为什么是字符串而不是数字码：
  //   · **唯一源**是 .proto 里的 `service` 定义——protoc 会校验 req/rsp 类型真的存在，
  //     而"另写一张 method 码表"无法校验，改名 message 时它只会静默过时（我们确实踩到过）。
  //   · 抓包/日志直接可读，排障不用查表。
  //   · 代价 ~20 字节/帧：在 1.9 KB 的状态包上是 1%，在小 RPC 上约 15%。
  //   · 服务端分发可以自行 intern 成内部整数（进程内缓存），但**线上**保持字符串。
  string method = 2;

  // 请求-响应配对：
  //   REQUEST  → 发送方填（>0，连接内单调递增，在途期间不复用）
  //   RESPONSE → 原样回填请求里的值
  //   NOTIFY   → 必须为 0
  uint32 callback_id = 3;

  // 仅 RESPONSE 使用：0 = 成功（proto3 下不占字节）；非 0 见 common.ErrorCode。
  uint32 status = 5;

  // 具体消息的 protobuf 编码。类型由 (msg_type, method) 决定。
  bytes body = 4;

  // 6–15 保留：trace id、灰度标签、压缩后的 body……一律通过新增字段扩展，
  // 永远不要再往 8 字节帧头里加东西。
  reserved 6 to 15;
}
