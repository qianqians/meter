syntax = "proto3";

// gate ⇄ logic 的**内部**协议。
//
// 对照 abelkhan：它的 hub_gate.proto 是同一层（gate 与逻辑 hub 之间的会话与投递）。
//
// 关键约束（docs/protocol-map.md §2 / §4）：
//   · **方法名不再是数字码段**：method 是字符串（"gate.xxx"），与客户端协议同一套规则。
//   · 这一层的消息同样塞进 `Envelope`（envelope.proto）的 `body` 里；跨进程的路由信息
//     **由消息自己的字段表达**（`conn_id` / `entity_id`），没有额外的内部封套；
//     节点间的连接由部署拓扑决定（一条 gate→logic 的长连接就代表"发给这个节点"）。
//   · gate 的会话表是路由的唯一来源：`conn_id → user_id / entity_id → node`；
//     反向 `entity_id → conn_id` 用于把逻辑层的实体级投递变成连接级投递。
//
// 命名约定（**两种前缀都是 hub → gate**，区别是 gate 拿到后做什么）：
//   · `Hub*`            = hub 要求 gate **维护状态**（建/删/刷新实体、踢人）→ 更新路由表
//   · `GateForwardHub*` = hub 要求 gate **转发给客户端**（gate forwards hub's call → client）
//
// 实体生命周期走 `HubCreatePlayerEntity` / `HubCreateRemoteEntity` / `HubDeleteRemoteEntity` /
// `HubRefreshEntity`：**gate 据此维护 `conn_id ⇄ entity_id` 的双向路由**，客户端协议里的
// `CallEntity{entity_id, content}` 才能被翻译成"发给哪条连接"。

package fw;

import "common.proto";

option go_package = "meter/schema/pb;pb";

// ---------------------------------------------------------------------------
// 会话生命周期
// ---------------------------------------------------------------------------


// ---------------------------------------------------------------------------
// 一、hub → gate：实体生命周期（gate 据此维护 conn ⇄ entity 双向路由）
// ---------------------------------------------------------------------------
//
// 命名约定：`Hub*` = hub（逻辑层）发给 gate 的；`GateForwardHub*` = gate 发给 hub 的。

// 玩家自己的实体创建：gate 在这里建立 `conn_id ⇄ entity_id` 的绑定。
message HubCreatePlayerEntity {
  string conn_id = 1;
  string user_id = 2;
  string entity_id = 3;
  string entity_type = 4;
  bytes content = 5;
}

// 视野内的远程实体创建（不是所有权，只是投影）。
message HubCreateRemoteEntity {
  string conn_id = 1;
  string entity_id = 2;
  string entity_type = 3;
  bytes content = 4;
}

// 远程实体销毁（离开视野 / 死亡 / 被移除）。
message HubDeleteRemoteEntity {
  string conn_id = 1;
  string entity_id = 2;
}

// 远程实体刷新（属性/外观/状态机变化，id 不变）。
message HubRefreshEntity {
  string conn_id = 1;
  string entity_id = 2;
  string entity_type = 3;
  bytes content = 4;
}

// 请求 gate 踢掉某条连接上的客户端。
// gate 收到后：给客户端发 `client.proto` 的 `KickOff{error, prompt_info}`，然后关闭连接。
// **必须带 error**：客户端要按错误码分支（重复登录 → 提示"该账号已在别处登录"、
// 被管理员踢 → 提示"您已被移出游戏"、过载 → 提示重试），只给一句文案是不够的。
message HubKickOffClient {
  string conn_id = 1;
  ErrorCode error = 2;        // 与 client.proto 的 KickOff.error 同一个枚举语义
  string prompt_info = 3;     // 直接展示给玩家的文案（可为空，客户端可按 error 自己取文案）
}

// ---------------------------------------------------------------------------
// 二、gate → hub：把客户端的调用转发给逻辑层
// ---------------------------------------------------------------------------

// hub → gate → 客户端：把一次调用投给**某一条连接**。
// `conn_id` 是 gate 的寻址单位；`entity_id` 会一起带给客户端，
// 客户端拿它跟自己的实体比对，错投即可发现（廉价的路由自检）。
message GateForwardHubCallClient {
  string conn_id = 1;
  string entity_id = 2;
  bytes content = 3;

  // **业务方法名**（"entity.attack"）。外层 Envelope.method 装的是路由方法
  // （"gate.forwardHubCallClient"），因为 gate 得先知道 body 是什么类型才能路由；
  // 真正要展示给客户端的那个方法名放这里，gate 原样放进下发的 Envelope.method。
  string method = 4;
}

// hub → gate → 客户端：**组播**，一次发给多条连接。
//   · `conn_id`（repeated）= 收件连接列表，由 hub 或 gate 解析出来（gate 负责按 conn 去重，
//     因为玩家实体和它的宠物可能落在同一条连接上）；
//   · `entity_id` = 发起方/上下文实体（客户端据此知道"这条广播因谁而起"，可为空）。
message GateForwardHubCallGroup {
  repeated string conn_id = 1;
  string entity_id = 2;
  bytes content = 3;

  // 业务方法名（同 GateForwardHubCallClient.method）。
  string method = 4;
}

// hub → gate → 客户端：**广播**，发给所有在线连接。
// 与 `client.proto` 的 `CallGlobal` 是同一动作的两个层：hub 告诉 gate 广播，
// gate 再把 `CallGlobal{content, exclude_source}` 发给每个连接。
// `entity_id` = 发起方/上下文实体（可为空）。
message GateForwardHubCallGlobal {
  string entity_id = 1;
  bytes content = 2;

  // 业务方法名（同 GateForwardHubCallClient.method）。
  string method = 3;
}

// ---------------------------------------------------------------------------
// 停机排空（健康状态与负载上报由 consul 负责，不走消息）
// ---------------------------------------------------------------------------

// gate 要求逻辑层停机（运维动作，gate → logic，MSG_NOTIFY）。
// 逻辑层应在此之后只处理在途请求，不再接新会话。
message GateDrain {
  string gate_id = 1;
  uint32 grace_ms = 2;
  string reason = 3;
}
