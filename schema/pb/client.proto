syntax = "proto3";

// 服务端 → 客户端、且**客户端需要处理或应答**的消息。
//
// 判定规则只有一句：**客户端收到它之后要做事吗？**（等价于"这个包由谁消费"：客户端消费 → 本文件）
//   ✅ 是 → 放这里（连接元信息、登录结果、实体生命周期、踢人、公告、错误）
//   ❌ 否 → 不放这里。具体分两类：
//        · 客户端**发出**的请求（Login / Reconnect / Logout / AckReliable / HeartBeat）
//          —— 客户端不需要"响应"自己发出的东西，它们和转发信封一起归 gate.proto；
//        · 纯粹的**转发信封**（msg_id / conn_id / entity_id / err_msg / content 的路由外壳）。
//
// 由此推出两条具体规矩：
//   1. **`*Result` 消息里没有错误码。** 成功/失败由信封的 `status` 表达（0 = ok，非 0 见 ErrorCode），
//      包体只在成功时才需要解析。失败时包体通常是空的。
//   2. **方法名不在这里声明。** `.proto` 只管消息形状；方法名（"client.login"）由调用方定义，
//      类型绑定在业务侧的 RpcMap（引用具体 message 类型，改名即编译失败）。
//
// 唯一的例外是**单向通知**（KickOff / NotifyError / ServerNotice）：它们没有回包，
// 信封的 status 用不上，所以"原因"必须写在包体里。

// 层次（已定）：
//
//   帧头（二进制，不是 proto）   flags:zstd | len:包长 | ts:单调毫秒
//   └─ Envelope                 ← **最外层结构**，每条帧的 payload 就是它
//        msg_type / method / callback_id / status
//        body ∈ NotifyConnID | LoginResult | CreateEntity | CallEntity | CallGlobal …
//        （CallEntity 定义在 common.proto——两个方向共用）
//
// `CallEntity` / `CallGlobal` 的 `content` 里是**逻辑层决定的那条 protobuf 消息的序列化字节**：
// 框架（gate）**不解释它**，甚至连类型都不知道——类型由**外层 `Envelope.method`** 决定，
// 客户端用 RpcMap、服务端用逻辑层的分发表各自解析。
//
// 所以只有一层 Envelope：method / callback_id / status 只在最外层出现一次，没有嵌套。

package fw;

import "common.proto";

option go_package = "meter/schema/pb;pb";

// ---------------------------------------------------------------------------
// 1. 连接建立：NotifyConnID
// ---------------------------------------------------------------------------

// 连接建立后服务端**主动推送**的第一条消息，一次把客户端需要的元信息全给它
// （取代了"版本握手 + 能力查询"两步）。
message NotifyConnID {
  // gate 分配的连接标识。断线重连时客户端带回它，服务端据此找回旧会话。
  string conn_id = 1;

  reserved 2;   // 原来的 map<string,int32> rpc_list，已删除

  // 这里**没有 rpc 列表**：方法名本身就是字符串（`Envelope.method`），
  // 客户端靠自己那份 `RpcMap`（codegen 出来的 method → 消息类型）分派，
  // 服务端支持哪些方法由 `proto_ver` 的版本协商决定，不需要再下发一张表。
  // 少一张表 = 少一处会和 schema 漂移的真相。

  // 协商并生效的协议版本。此后所有帧都必须符合它。
  uint32 proto_ver = 3;

  // 服务端时间（毫秒），客户端据此算时钟偏差（只用于展示，不用于判定）。
  uint64 server_time_ms = 4;

  // 建议的心跳间隔（毫秒）；0 表示用服务端默认。
  uint32 heartbeat_ms = 5;

  // 服务端允许的单帧上限（字节）。客户端发送端据此切块。
  uint32 max_frame_bytes = 6;
}

// ---------------------------------------------------------------------------
// 2. 登录结果（响应 Login 的包体；Login 本身在 gate.proto）
// ---------------------------------------------------------------------------
//
// 成功时才解析本消息；失败时信封 status ≠ 0、包体为空。
message LoginResult {
  string user_id = 1;
  string entity_id = 2;      // 当前控制的实体（登录成功即有）

  // 断线重连票据；客户端应保存，重连时回传。不透明字节。
  bytes resume_token = 3;

  // true = 客户端丢弃本地缓存，按全量重建（例如断线期间场景已重载）。
  bool full_resync = 4;
}

// ---------------------------------------------------------------------------
// 3. 创建实体
// ---------------------------------------------------------------------------
//
// 自己的实体与"视野里的别人"分开：前者是所有权，后者只是视野投影，
// 二者的生命周期与权限完全不同。

// 玩家自己的实体（登录后创建 / 重连后重建）。
message CreatePlayerEntity {
  string entity_id = 1;
  string entity_type = 2;   // "player" 或具体职业模板 id，由业务定义
  bytes content = 3;           // 业务初始化参数（逻辑层决定的不透明字节）
}

// 视野内的远程实体。**这不是所有权**：客户端不能对它发控制类 RPC。
message CreateRemoteEntity {
  string entity_id = 1;
  string entity_type = 2;
  bytes content = 3;
}

// ---------------------------------------------------------------------------
// 4. 实体刷新 / 5. 实体销毁
// ---------------------------------------------------------------------------

// 实体视图刷新（服务端推送）：属性变化、外观变化、状态机切换。
// 与 Delete + Create 的区别：id 不变，客户端应**原地更新**而不是重建。
message RefreshEntity {
  string entity_id = 1;
  string entity_type = 2;
  bytes content = 3;
  uint32 reason = 4;        // 0=普通属性 1=外观 2=状态机（业务自定）
}

// 实体销毁（服务端推送）：离开视野、死亡、被移出场景。
message DeleteEntity {
  string entity_id = 1;
  uint32 reason = 2;        // 0=离开视野 1=死亡 2=被移除（业务自定）
}

// ---------------------------------------------------------------------------
// 6. 踢下线
// ---------------------------------------------------------------------------

// 服务端 → 客户端。单向通知，发出后 gate 关闭连接。
// 这里保留 `error` 是因为它是**单向**消息：没有回包，信封的 status 表达不了原因。
message KickOff {
  ErrorCode error = 1;
  string prompt_info = 2;   // 直接展示给玩家的文案（可为空）
}

// ---------------------------------------------------------------------------
// 7. 心跳回包（响应 HeartBeat；HeartBeat 本身在 gate.proto）
// ---------------------------------------------------------------------------
//
// 注意：最省的保活是 **`len == 0` 的空帧**（帧头的 `ts` 已能算 RTT），
// 本消息只服务于"需要服务端校时"的场景。

message HeartBeatResult {
  uint64 client_time_ms = 1;   // 原样回传
  uint64 server_time_ms = 2;   // 服务端当前时间
}

// ---------------------------------------------------------------------------
// 8. 重连结果（响应 Reconnect；Reconnect 本身在 gate.proto）
// ---------------------------------------------------------------------------

message ReconnectResult {
  string conn_id = 1;        // 新连接 id（旧的必然已失效）
  bool full_resync = 2;      // true = 客户端丢弃本地缓存重新拉
}

// ---------------------------------------------------------------------------
// 8.5 服务端调用客户端（客户端必须执行；要不要回包看信封）
// ---------------------------------------------------------------------------
//
// 语义：实体是双端的——服务端持有权威状态、客户端持有视图。某些动作必须让客户端那一侧执行
// （播放表现、采集本机信息、确认资源版本……），这时服务端用 CallEntity 调它。
//
// 消息本体 `CallEntity{entity_id, content}` 定义在 **common.proto**（两个方向共用同一形状）。
//
//   · 要回包 → 外层 Envelope 的 msg_type = MSG_REQUEST；客户端执行完后发回一条普通帧：
//     `Envelope{msg_type=MSG_RESPONSE, callback_id=<同一个>, status=<成败>, body=<逻辑层决定的响应消息>}`
//     —— **没有专门的"回包包体类型"**，回包就是一条普通的 RESPONSE 帧
//   · 不回包 → 外层 Envelope 的 msg_type = MSG_NOTIFY，callback_id = 0


// 广播：一条报文发给**所有在线连接**。收端不回包（msg_type = MSG_NOTIFY）。
//
// 组播要回包会产生 N 条响应、服务端处理不了；需要逐个收集结果就发 N 条 CallEntity。
message CallGlobal {
  // 逻辑层决定的 protobuf 消息的序列化字节。
  bytes content = 1;

  // true = 不给发起方回发（广播场景最常用）。
  bool exclude_source = 2;
}

// ---------------------------------------------------------------------------
// 9. 错误 / 公告（一次性单向消息，客户端收到后处理，不必回复）
// ---------------------------------------------------------------------------

// 通用错误/提示（没有 callback 可回的失败，例如批量异步操作）。
message NotifyError {
  ErrorCode error = 1;

  // 关联的方法名（"entity.attack" 这种），便于客户端定位是哪条请求失败；空 = 不关联。
  // 注意是**方法名**不是 id：我们没有 id 映射表。
  string related_method = 2;
}

// 运营/运维公告：维护、强制更新、限流。
message ServerNotice {
  uint32 code = 1;           // 1=维护中 2=强制更新 3=限流 4=公告
  string text = 2;
  uint32 retry_after_ms = 3; // 维护/限流时的建议重试间隔
}
