syntax = "proto3";

// 客户端 ⇄ gate 的**框架面**协议。
//
// 对照 abelkhan：它的 client.proto + gate_client.proto 就是这一层（握手、会话、转发壳）。
// 我们把它合并成一个文件，因为 gate 在我们的架构里只做三件事：
//   ① 握手/版本协商  ② 会话（连接 → session → entity → 逻辑节点）  ③ 只读 4 字节帧头后透传 payload
//
// ⚠️ 这里**没有**任何业务消息。登录之后的背包/任务/战斗等，都是业务域的 method code，
// 通过同一套 Envelope 走，不在此文件里定义。

package fw;

import "common.proto";

option go_package = "meter/schema/pb;pb";

// ---------------------------------------------------------------------------
// 握手（帧内第一条消息，必须最先发）
// ---------------------------------------------------------------------------

message Hello {
  // 客户端协议版本。允许范围 [proto_ver_min, proto_ver_max]，gate 取交集后选最大。
  uint32 proto_ver_min = 1;
  uint32 proto_ver_max = 2;

  // 客户端版本号（形如 "1.4.2"），仅用于灰度与日志，不参与协商。
  string client_ver = 3;

  // 平台标识（"cocos-native" / "wechat-mini" / "douyin-mini" …），由客户端自报，服务端可覆盖。
  string platform = 4;

  // 客户端本地时间（毫秒），用于在 HelloAck 里回算时钟偏差。
  uint64 client_time_ms = 5;
}

message HelloAck {
  // 协商结果。0 表示成功；非 0 时本字段之外的内容不应被使用。
  ErrorCode error = 1;

  // 选定并生效的协议版本。此后所有帧都必须符合它。
  uint32 proto_ver = 2;

  // gate 分配的会话 id。断线重连时带上它（见 ResumeRequest）。
  uint64 session_id = 3;

  // 服务端时间（毫秒），配合 Hello.client_time_ms 可算出时钟偏差。
  uint64 server_time_ms = 4;

  // 心跳间隔建议值（毫秒）；0 表示用服务端默认。
  uint32 heartbeat_ms = 5;

  // 服务端允许的单帧上限（字节）。客户端发送端应据此切块。
  uint32 max_frame_bytes = 6;
}

// ---------------------------------------------------------------------------
// 会话：鉴权与恢复
// ---------------------------------------------------------------------------

// 鉴权请求（MSG_REQUEST，method = 0x0101）。
// gate 不解析它——原样转给逻辑层；逻辑层校验后回 AuthResult。
message AuthRequest {
  // 平台登录票据（如微信/抖音的 code 或服务端签发的 token）。框架不解释内容。
  string token = 1;

  // 客户端希望进入的服务器/分线 id（可空，表示由服务端分配）。
  string server_id = 2;
}

message AuthResult {
  ErrorCode error = 1;

  // 成功后由逻辑层绑定：账号 id 与当前控制的实体 id。
  uint64 uid = 2;
  uint64 entity_id = 3;

  // 逻辑层所在节点（客户端不需要，gate 用它更新会话表）。
  string node_id = 4;

  // 断线恢复用的不透明票据；客户端应保存并在 ResumeRequest 里回传。
  bytes resume_token = 5;
}

// 断线重连（MSG_REQUEST，method = 0x0102）。
// 与 AuthRequest 的区别：这里已持有上一次会话的 id 与票据，目标是"接着用"而不是"重新登录"。
message ResumeRequest {
  uint64 session_id = 1;
  bytes resume_token = 2;
  uint64 client_time_ms = 3;
}

message ResumeResult {
  ErrorCode error = 1;

  // 成功时给出新会话（旧的必然已失效：gate 在断开时立即回收）。
  uint64 session_id = 2;

  // 是否需要客户端重建全部客户端状态（例如断线期间场景已重载）。
  bool full_resync = 3;

  uint64 server_time_ms = 4;
}

// 主动登出（MSG_NOTIFY，method = 0x0103）。
message Logout {
  string reason = 1;
}

// ---------------------------------------------------------------------------
// 链路保活与 RTT
// ---------------------------------------------------------------------------
//
// 注意：**`len == 0` 的帧就是最轻的保活**（见 docs/protocol-map.md §4.4-2），
// 不需要任何 proto 消息、不占 payload。下面两个消息只在"需要测 RTT"时才用。

message Ping {
  uint64 client_time_ms = 1;
}

message Pong {
  uint64 client_time_ms = 1;   // 原样回传
  uint64 server_time_ms = 2;   // 服务端当前时间
}

// ---------------------------------------------------------------------------
// 服务端主动下发（MSG_NOTIFY）
// ---------------------------------------------------------------------------

// 踢下线（method = 0x0901）。发出后 gate 关闭连接。
message Kicked {
  ErrorCode error = 1;
}

// 通用错误/提示推送（method = 0x0902）。用于"某次请求没有 callback 可用"的场景。
message ErrorNotify {
  ErrorCode error = 1;

  // 可选：关联的方法码，便于客户端定位是哪条请求失败。
  uint32 related_method = 2;
}
