syntax = "proto3";

// logic ⇄ logic 的**内部**协议：实体迁移、跨实体调用、频道广播。
//
// 对照 abelkhan：它的 hub_hub.proto 是这一层（hub 之间）。
//
// 三条边界（不遵守就会长出第二套真相）：
//   1. 跨节点调用只**转发**，不在中转节点上执行业务逻辑。
//   2. 实体迁移必须由**原节点**发起并完成落库，之后新节点才是权威（"内核是唯一写者"）。
//   3. 这里不出现任何业务语义；业务消息一律以不透明字节透传。
//   4. **方法名不在 schema 里**：调用方给 "cluster.transfer.prepare" 这类字符串，
//      消息只描述形状（与客户端协议、gate 层同一套规则）。
//   5. **服务发现、注册、健康检查、负载上报全部交给 consul**：本文件里**没有**节点注册、
//      心跳、上线/下线通知——对端地址从 consul 查，节点死掉由 consul 的健康检查摘掉，
//      "连不上"就重连。少一套自研发现协议，就少一处会和 consul 打架的真相。
//   6. **"逻辑层决定的字节"一律叫 `content`**（原 state / body / payload 已统一），
//      与客户端协议的 `CallEntity.content` 同名同义：框架不解释它。

package fw;

import "common.proto";

option go_package = "meter/schema/pb;pb";

// ---------------------------------------------------------------------------
// 实体迁移
// ---------------------------------------------------------------------------
//
// 顺序（缺一不可）：
//   ① 原节点停止对该实体的写权（标记 migrating）
//   ② TransferPrepare → 新节点回 TransferReady，表示已就绪接收入口流量
//   ③ 原节点用 TransferCommit 交付最终状态（含已落库的 version）
//   ④ 新节点 TransferAck 之后成为唯一写者；原节点丢弃本地副本
//   ⑤ gate 侧用 SessionRebind 更新路由

message TransferPrepareRequest {
  string entity_id = 1;
  string from_node = 2;
  string to_node = 3;
  uint32 proto_ver = 4;
}
message TransferPrepareResponse {
  ErrorCode error = 1;
  bool ready = 2;                  // false = 目标过载/正在迁移，原节点应稍后重试
}

message TransferCommitRequest {
  string entity_id = 1;
  bytes  content = 2;              // 该实体的最终状态（逻辑层决定的不透明字节）
  uint64 version = 3;              // 与 hub 存储模块对齐的版本号（乐观锁）
  uint64 handoff_time_ms = 4;
}
message TransferCommitResponse {
  ErrorCode error = 1;
  bool accepted = 2;
}

// ---------------------------------------------------------------------------
// 跨实体调用（框架级转发，不含业务）
// ---------------------------------------------------------------------------
//
// 客户端只能操作"自己的"实体；服务端内部则经常需要"让 A 去处理 B"（组队、交易、战斗协战）。
// 这类调用统一走这里，而不是让各业务自己写一套转发。

// 跨实体调用：目标节点按 `dst_entity` 找到本地实体，再用 `method` + `content` 执行。
// （没有内部封套，所以路由信息必须显式写在这条消息里。）
message CrossCallRequest {
  string dst_entity = 1;
  string method = 2;               // 目标方法名（由目标节点自身分发）
  bytes  content = 3;              // 目标方法的请求体（逻辑层决定的不透明字节）
  string trace_id = 4;
}
message CrossCallResponse {
  ErrorCode error = 1;
  bytes body = 2;                  // 目标方法的响应体（成功时）
}

// ---------------------------------------------------------------------------
// 频道（场景/世界）广播
// ---------------------------------------------------------------------------
//
// 逻辑层内部常见的"向某个频道/场景的所有订阅者推一条"——放在框架面，
// 避免每个业务都实现一遍扇出。真正的字节由调用方给（通常是客户端可直接消费的 Envelope）。

message ChannelPublish {
  string channel = 1;              // "scene:1001" / "world:notice" …
  bytes  content = 2;              // 对订阅者原样下发（逻辑层决定的不透明字节）
  bool   exclude_source = 3;       // 命名与 CallGlobal.exclude_source 保持一致
}
message ChannelPublishAck {
  ErrorCode error = 1;
  uint32 receivers = 2;
}
