# method code 注册表（唯一源）
#
# 规则（docs/protocol-map.md §4.5）：
#   · 方法名在 payload 的 Envelope.method 里，不进帧头。这里是它的**唯一**分配表。
#   · 段内顺序分配；废弃的 code 移到 retired:，**永不复用**。
#   · 本期只登记框架面（0x00xx–0x0Cxx）。业务域（≥0x10xx）等框架定稿后再加，
#     按 docs/protocol-map.md §3 的域划分继续往下分。
#
# 生成：本文件被 codegen 读入，产出
#   · TS:  const MSG_TYPE / Method / 方法名↔code 双向表
#   · Go:  常量与分发表
# 生成的常量**不要**在 TS 侧退回成 enum（会让 core 的 erasableSyntaxOnly 失败）。

version: 1

# msg_type 的**权威定义在 schema/pb/envelope.proto 的 MsgType enum**。
# 这里只是镜像，供 gen-methods.mjs 校验每个 method 的 msg_type 拼写是否合法。
msg_types:
  MSG_NONE: 0
  MSG_REQUEST: 1
  MSG_RESPONSE: 2
  MSG_NOTIFY: 3

# 段划分。业务段保留但不分配。
ranges:
  "0x0000-0x00FF": "框架 · 链路（ping / 保活）"
  "0x0100-0x01FF": "框架 · 连接与会话（握手 / 鉴权 / 恢复 / 登出）"
  "0x0900-0x09FF": "框架 · 服务端下发（踢人 / 错误提示），仅下行"
  "0x0A00-0x0AFF": "内部 · gate ⇄ logic（仅内部链路）"
  "0x0B00-0x0BFF": "内部 · logic ⇄ dbproxy（仅内部链路）"
  "0x0C00-0x0CFF": "内部 · logic ⇄ logic（仅内部链路）"
  "0x0F00-0x0FFF": "运维 / GM（仅后台）"
  "0x1000-0xFFFF": "业务功能（本期不生成）"

# 每条方法：code / name / msg_type / req / rsp / dir / 备注
# dir: c2s（客户端上行）| s2c（服务端下发）| internal（仅内部链路）
methods:
  # ---------- 0x00xx 链路 ----------
  - code: 0x0001
    name: Ping
    msg_type: MSG_REQUEST
    req: fw.Ping
    rsp: fw.Pong
    dir: c2s
    note: RTT 测量用。最轻的保活是 len==0 的帧，不需要任何消息。

  # ---------- 0x01xx 连接与会话 ----------
  - code: 0x0100
    name: Hello
    msg_type: MSG_REQUEST
    req: fw.Hello
    rsp: fw.HelloAck
    dir: c2s
    note: 连接建立后的第一条消息，版本协商。gate 自己应答，不转逻辑层。

  - code: 0x0101
    name: Auth
    msg_type: MSG_REQUEST
    req: fw.AuthRequest
    rsp: fw.AuthResult
    dir: c2s
    note: 鉴权。gate 原样转逻辑层；成功后逻辑层调 SessionBind。

  - code: 0x0102
    name: Resume
    msg_type: MSG_REQUEST
    req: fw.ResumeRequest
    rsp: fw.ResumeResult
    dir: c2s
    note: 断线重连，凭 resume_token 接着用。

  - code: 0x0103
    name: Logout
    msg_type: MSG_NOTIFY
    req: fw.Logout
    rsp: null
    dir: c2s
    note: 主动登出，无应答。

  # ---------- 0x09xx 服务端下发 ----------
  - code: 0x0901
    name: Kicked
    msg_type: MSG_NOTIFY
    req: fw.Kicked
    rsp: null
    dir: s2c
    note: 发出后 gate 关闭连接。

  - code: 0x0902
    name: ErrorNotify
    msg_type: MSG_NOTIFY
    req: fw.ErrorNotify
    rsp: null
    dir: s2c
    note: 没有 callback 可用的错误提示。

  # ---------- 0x0Axx gate ⇄ logic ----------
  - code: 0x0A01
    name: SessionBind
    msg_type: MSG_REQUEST
    req: fw.SessionBindRequest
    rsp: fw.SessionBindResponse
    dir: internal
  - code: 0x0A02
    name: SessionUnbind
    msg_type: MSG_NOTIFY
    req: fw.SessionUnbind
    rsp: null
    dir: internal
  - code: 0x0A03
    name: KickSession
    msg_type: MSG_NOTIFY
    req: fw.KickSession
    rsp: null
    dir: internal
  - code: 0x0A04
    name: SessionRebind
    msg_type: MSG_NOTIFY
    req: fw.SessionRebind
    rsp: null
    dir: internal
    note: 实体迁移/换角后更新 gate 的会话表。
  - code: 0x0A10
    name: DeliverUpstream
    msg_type: MSG_NOTIFY
    req: fw.DeliverUpstream
    rsp: null
    dir: internal
    note: payload 是客户端原始 Envelope 字节，gate 未解析。
  - code: 0x0A11
    name: DeliverDownstream
    msg_type: MSG_NOTIFY
    req: fw.DeliverDownstream
    rsp: null
    dir: internal
  - code: 0x0A12
    name: DeliverDownstreamBatch
    msg_type: MSG_NOTIFY
    req: fw.DeliverDownstreamBatch
    rsp: null
    dir: internal
    note: 同一段字节发给多会话，避免 N 次调用。
  - code: 0x0A20
    name: NodeLoadReport
    msg_type: MSG_NOTIFY
    req: fw.NodeLoadReport
    rsp: null
    dir: internal
  - code: 0x0A21
    name: GateDrain
    msg_type: MSG_NOTIFY
    req: fw.GateDrain
    rsp: null
    dir: internal

  # ---------- 0x0Bxx logic ⇄ dbproxy ----------
  - code: 0x0B01
    name: StorageGet
    msg_type: MSG_REQUEST
    req: fw.GetRequest
    rsp: fw.GetResponse
    dir: internal
  - code: 0x0B02
    name: StorageBatchGet
    msg_type: MSG_REQUEST
    req: fw.BatchGetRequest
    rsp: fw.BatchGetResponse
    dir: internal
  - code: 0x0B03
    name: StorageSet
    msg_type: MSG_REQUEST
    req: fw.SetRequest
    rsp: fw.SetResponse
    dir: internal
  - code: 0x0B04
    name: StorageBatchSet
    msg_type: MSG_REQUEST
    req: fw.BatchSetRequest
    rsp: fw.BatchSetResponse
    dir: internal
    note: 非事务：逐项独立成败。
  - code: 0x0B05
    name: StorageDelete
    msg_type: MSG_REQUEST
    req: fw.DeleteRequest
    rsp: fw.DeleteResponse
    dir: internal
  - code: 0x0B06
    name: StorageExists
    msg_type: MSG_REQUEST
    req: fw.ExistsRequest
    rsp: fw.ExistsResponse
    dir: internal
  - code: 0x0B0F
    name: StorageHealth
    msg_type: MSG_NOTIFY
    req: fw.StorageHealth
    rsp: null
    dir: internal

  # ---------- 0x0Cxx logic ⇄ logic ----------
  - code: 0x0C01
    name: NodeRegister
    msg_type: MSG_REQUEST
    req: fw.RegisterRequest
    rsp: fw.RegisterResponse
    dir: internal
  - code: 0x0C02
    name: NodeHeartbeat
    msg_type: MSG_NOTIFY
    req: fw.NodeHeartbeat
    rsp: null
    dir: internal
  - code: 0x0C03
    name: NodeGone
    msg_type: MSG_NOTIFY
    req: fw.NodeGone
    rsp: null
    dir: internal
  - code: 0x0C10
    name: TransferPrepare
    msg_type: MSG_REQUEST
    req: fw.TransferPrepareRequest
    rsp: fw.TransferPrepareResponse
    dir: internal
  - code: 0x0C11
    name: TransferCommit
    msg_type: MSG_REQUEST
    req: fw.TransferCommitRequest
    rsp: fw.TransferCommitResponse
    dir: internal
    note: 新节点 Ack 之后才成为唯一写者。
  - code: 0x0C20
    name: CrossCall
    msg_type: MSG_REQUEST
    req: fw.CrossCallRequest
    rsp: fw.CrossCallResponse
    dir: internal
    note: 跨实体调用只转发，不在中转节点执行业务。
  - code: 0x0C30
    name: ChannelPublish
    msg_type: MSG_REQUEST
    req: fw.ChannelPublish
    rsp: fw.ChannelPublishAck
    dir: internal
    note: 频道/场景扇出，避免各业务自造。

# 已废弃的 code（永不复用；保留号码本身作为墓碑）
retired: []
